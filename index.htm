<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>環安室疫苗接種小助手 🧸 2026 長庚大學流感·新冠</title>
  
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Firebase 9.x SDK (即時資料庫模組) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ✅ 已自動帶入您的 Firebase 資料庫設定
    const firebaseConfig = {
      databaseURL: "https://flu-vaccine-2026-default-rtdb.firebaseio.com"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const stateRef = ref(db, 'vaccine_state');

    // 預設資料
    window.state = {
      station1: 0,
      station2: 0,
      station3: 0,
      lastTicketNum: 0,
      broadcastMsg: "現場廣播：請依現場三站叫號燈號依序前往。✨",
      lastUpdated: "--:--"
    };

    // 1. 監聽 Firebase 雲端資料變化 (全場手機秒級自動同步更新)
    onValue(stateRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        window.state = data;
        window.updateUI();
      }
    });

    // 2. 將本地資料推送到 Firebase 雲端
    window.syncState = function() {
      window.state.lastUpdated = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
      set(stateRef, window.state);
    };
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dusty: {
              pink: '#DC9B9B', pinkLight: '#E8B4B4', pinkBg: '#EAA8A8',
              cardBg: '#FFF9F8', mint: '#D8E2DC', mintText: '#3B5349',
              cream: '#FFE5EC', yellow: '#FBE8A6', yellowText: '#6A5618',
              purple: '#E2D4E0', purpleText: '#5A3D55', dark: '#3D3435'
            }
          },
          fontFamily: { sans: ['"Rounded Mplus 1c"', '"JhengHei"', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #E69D9D;
      background-image: radial-gradient(rgba(255, 255, 255, 0.25) 18%, transparent 18%), radial-gradient(rgba(255, 255, 255, 0.25) 18%, transparent 18%);
      background-size: 32px 32px;
      color: #3D3435;
    }
    .hand-card { background-color: #FFF9F8; border: 2.5px solid #3D3435; border-radius: 20px; box-shadow: 3px 4px 0px #3D3435; }
    .hand-btn { border: 2px solid #3D3435; border-radius: 12px; box-shadow: 2px 3px 0px #3D3435; }
    .hand-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #3D3435; }
    .hand-input { border: 2px solid #3D3435; border-radius: 10px; }
  </style>
</head>

<body class="h-full antialiased font-sans flex flex-col justify-between select-none">
  <div class="max-w-md mx-auto w-full min-h-screen flex flex-col bg-dusty-pinkBg/30 border-x-2 border-dusty-dark shadow-2xl relative pb-24">
    
    <!-- 頂部 Header -->
    <header class="bg-white p-4 sticky top-0 z-30 border-b-2 border-dusty-dark flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-full bg-dusty-pink flex items-center justify-center text-white border-2 border-dusty-dark font-black text-lg">💉</div>
        <div>
          <h1 class="text-base font-black text-dusty-dark">疫苗接種小助手</h1>
          <p class="text-[10px] text-slate-500 font-bold">☁️ Firebase 雲端秒級同步版</p>
        </div>
      </div>
      <button onclick="toggleRoleModal()" class="hand-btn bg-dusty-purple text-dusty-purpleText text-xs px-2.5 py-1.5 font-bold">⚙️ 醫護後台</button>
    </header>

    <!-- 廣播 Banner -->
    <div id="broadcastBanner" class="mx-4 mt-3 bg-dusty-yellow p-3 rounded-2xl border-2 border-dusty-dark text-xs font-bold text-dusty-yellowText flex items-center justify-between">
      <div class="flex items-center gap-2 overflow-hidden">
        <span>📢</span>
        <span id="broadcastText" class="truncate">現場廣播載入中...</span>
      </div>
    </div>

    <!-- 主要叫號看板區 -->
    <main class="p-4 space-y-4">
      <div class="hand-card bg-white p-4 space-y-3">
        <div class="text-center pb-2 border-b-2 border-dashed border-dusty-dark">
          <span class="inline-flex items-center gap-1.5 bg-dusty-mint text-dusty-mintText text-xs font-bold px-3 py-1 rounded-full border border-dusty-dark">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> 全場即時叫號連線中
          </span>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-dusty-cream p-2.5 rounded-2xl border-2 border-dusty-dark">
            <p class="text-[11px] font-bold text-slate-600">1. 掛號窗口</p>
            <div class="text-2xl font-black text-dusty-dark my-1" id="callStation1">000</div>
          </div>
          <div class="bg-dusty-yellow/60 p-2.5 rounded-2xl border-2 border-dusty-dark">
            <p class="text-[11px] font-bold text-dusty-yellowText">2. 醫師問診</p>
            <div class="text-2xl font-black text-dusty-dark my-1" id="callStation2">000</div>
          </div>
          <div class="bg-dusty-mint p-2.5 rounded-2xl border-2 border-dusty-dark">
            <p class="text-[11px] font-bold text-dusty-mintText">3. 注射診間</p>
            <div class="text-2xl font-black text-dusty-dark my-1" id="callStation3">000</div>
          </div>
        </div>
        <p class="text-[10px] text-center text-slate-400 font-bold">同步時間：<span id="lastUpdatedDisplay">--:--</span></p>
      </div>

      <!-- 個人對照號碼牌 -->
      <div class="hand-card bg-dusty-yellow/60 p-4 space-y-2">
        <h3 class="text-xs font-bold text-dusty-dark">🎫 對照我的號碼進度</h3>
        <div class="flex gap-2">
          <input type="number" id="myNumberInput" placeholder="輸入您的號碼 (例如 5)" class="w-full bg-white border-2 border-dusty-dark rounded-xl px-3 py-1.5 text-xs font-bold text-center">
          <button onclick="checkQueueStatus()" class="hand-btn bg-dusty-yellow text-dusty-dark font-bold px-4 py-1.5 text-xs shrink-0">🔍 對照</button>
        </div>
        <div id="queueResult" class="hidden p-2 rounded-xl text-xs font-bold text-center border-2 border-dusty-dark"></div>
      </div>
    </main>
  </div>

  <!-- 醫護人員後台 Modal -->
  <div id="roleModal" class="fixed inset-0 bg-dusty-dark/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="hand-card bg-white max-w-sm w-full p-5 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-base font-bold">👩‍⚕️ 醫護號碼控制台</h3>
        <button onclick="toggleRoleModal()" class="text-slate-400 font-bold">✕</button>
      </div>
      <div id="authBox" class="space-y-2">
        <input type="password" id="pinInput" placeholder="請輸入 PIN 碼 (預設 8888)" class="w-full border-2 border-dusty-dark rounded-xl px-3 py-2 text-center text-xs font-bold">
        <button onclick="verifyPin()" class="hand-btn w-full bg-dusty-purple text-dusty-purpleText font-bold py-2 text-xs">解鎖控制</button>
      </div>
      <div id="controlBox" class="space-y-3 hidden">
        <div class="bg-dusty-mint p-3 rounded-xl border-2 border-dusty-dark space-y-2 text-xs font-bold">
          <div class="flex justify-between items-center">
            <span>1. 掛號號碼：</span>
            <input type="number" id="adminCall1" class="w-16 border rounded text-center" value="0">
          </div>
          <div class="flex justify-between items-center">
            <span>2. 問診號碼：</span>
            <input type="number" id="adminCall2" class="w-16 border rounded text-center" value="0">
          </div>
          <div class="flex justify-between items-center">
            <span>3. 注射號碼：</span>
            <input type="number" id="adminCall3" class="w-16 border rounded text-center" value="0">
          </div>
          <button onclick="saveAllStations()" class="hand-btn w-full bg-dusty-mintText text-white py-1.5 mt-1">📡 廣播同步全場</button>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold">推送現場廣播：</label>
          <input type="text" id="adminBroadcastInput" placeholder="輸入廣播文字" class="w-full border-2 border-dusty-dark rounded-xl px-3 py-1.5 text-xs font-bold">
          <button onclick="sendBroadcast()" class="hand-btn w-full bg-dusty-yellow text-dusty-dark font-bold py-1.5 text-xs">發布廣播</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 渲染 UI 函數
    window.updateUI = function() {
      document.getElementById('callStation1').innerText = String(window.state.station1 || 0).padStart(3, '0');
      document.getElementById('callStation2').innerText = String(window.state.station2 || 0).padStart(3, '0');
      document.getElementById('callStation3').innerText = String(window.state.station3 || 0).padStart(3, '0');
      document.getElementById('lastUpdatedDisplay').innerText = window.state.lastUpdated || '--:--';
      document.getElementById('broadcastText').innerText = window.state.broadcastMsg || '';
      
      if (document.getElementById('adminCall1')) {
        document.getElementById('adminCall1').value = window.state.station1 || 0;
        document.getElementById('adminCall2').value = window.state.station2 || 0;
        document.getElementById('adminCall3').value = window.state.station3 || 0;
      }
    };

    function toggleRoleModal() { document.getElementById('roleModal').classList.toggle('hidden'); }
    function verifyPin() {
      if (document.getElementById('pinInput').value === '8888') {
        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('controlBox').classList.remove('hidden');
      } else { alert("PIN 碼錯誤！"); }
    }

    function saveAllStations() {
      window.state.station1 = parseInt(document.getElementById('adminCall1').value) || 0;
      window.state.station2 = parseInt(document.getElementById('adminCall2').value) || 0;
      window.state.station3 = parseInt(document.getElementById('adminCall3').value) || 0;
      window.syncState();
      alert("最新叫號已秒速廣播至全場所有人手機！");
    }

    function sendBroadcast() {
      window.state.broadcastMsg = document.getElementById('adminBroadcastInput').value;
      window.syncState();
      alert("廣播訊息已同步推播！");
    }

    function checkQueueStatus() {
      const myNum = parseInt(document.getElementById('myNumberInput').value);
      const res = document.getElementById('queueResult');
      if (!myNum || isNaN(myNum)) return;
      res.classList.remove('hidden');
      if (myNum <= window.state.station3) {
        res.className = "p-2 rounded-xl text-xs font-bold text-center bg-slate-200 text-slate-700 border-2 border-dusty-dark block";
        res.innerText = "您的號碼已完成注射或已過號。";
      } else if (myNum <= window.state.station2) {
        res.className = "p-2 rounded-xl text-xs font-bold text-center bg-dusty-mint text-dusty-mintText border-2 border-dusty-dark block";
        res.innerText = "💉 請前往【3. 注射診間】準備接種！";
      } else if (myNum <= window.state.station1) {
        res.className = "p-2 rounded-xl text-xs font-bold text-center bg-dusty-yellow text-dusty-dark border-2 border-dusty-dark block";
        res.innerText = "🩺 請前往【2. 醫師問診區】等候評估！";
      } else {
        const diff = myNum - window.state.station1;
        res.className = "p-2 rounded-xl text-xs font-bold text-center bg-white text-slate-700 border-2 border-dusty-dark block";
        res.innerText = `尚未叫號，目前第1站進度為 ${window.state.station1} 號，您還需等候約 ${diff} 人。`;
      }
    }
  </script>
</body>
</html>
