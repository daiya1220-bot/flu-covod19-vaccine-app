<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>流感疫苗接種小助手 🧸 | 莫蘭迪灰粉手繪版</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dusty: {
              pink: '#DC9B9B',
              pinkLight: '#E8B4B4',
              pinkBg: '#EAA8A8',
              cardBg: '#FFF9F8',
              mint: '#D8E2DC',
              mintText: '#3B5349',
              cream: '#FFE5EC',
              yellow: '#FBE8A6',
              yellowText: '#6A5618',
              blue: '#D2E3ED',
              blueText: '#2B4A5E',
              purple: '#E2D4E0',
              purpleText: '#5A3D55',
              dark: '#3D3435'
            }
          },
          fontFamily: {
            sans: ['"Rounded Mplus 1c"', '"Chalkboard SE"', '"JhengHei"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #E69D9D;
      background-image: radial-gradient(rgba(255, 255, 255, 0.25) 18%, transparent 18%), radial-gradient(rgba(255, 255, 255, 0.25) 18%, transparent 18%);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: #3D3435;
    }

    .hand-card {
      background-color: #FFF9F8;
      border: 2.5px solid #3D3435;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      box-shadow: 3px 4px 0px #3D3435;
      transition: all 0.2s ease-in-out;
    }

    .hand-card-yellow {
      background-color: #FFF8E7;
      border: 2.5px solid #3D3435;
      border-radius: 22px 18px 24px 20px / 20px 24px 18px 22px;
      box-shadow: 3px 4px 0px #3D3435;
    }

    .hand-btn {
      border: 2px solid #3D3435;
      border-radius: 20px 8px 18px 10px;
      box-shadow: 2px 3px 0px #3D3435;
      transition: all 0.15s ease;
    }
    .hand-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #3D3435;
    }

    .hand-input {
      border: 2px solid #3D3435;
      border-radius: 12px;
      outline: none;
    }
    .hand-input:focus {
      border-color: #DC9B9B;
      box-shadow: 0 0 0 2px rgba(220, 155, 155, 0.4);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

        </button>
      </div>
